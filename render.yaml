# Render blueprint for the Duang Pang reading server (https://render.com/docs/blueprint-spec).
# In Render: New > Blueprint > pick this repository. You will be asked for GEMINI_API_KEY and NVIDIA_API_KEY.
services:
  - type: web
    name: duang-pang
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Hosting platforms route traffic to 0.0.0.0, not 127.0.0.1.
      - key: HOST
        value: 0.0.0.0
      # Render's proxy sets X-Forwarded-For, so per-visitor limits see real visitors.
      - key: TRUST_PROXY
        value: "1"
      # Diviner 3 (last fallback)
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      # Diviners 1 and 2 share the NVIDIA key.
      - key: NVIDIA_API_KEY
        sync: false
      - key: NEMOTRON_MODEL
        value: nvidia/nemotron-3.5-super-vl-120b-a12b
      - key: ULTRA_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b
      # The GitHub Pages site that may call this server.
      - key: ALLOWED_ORIGINS
        value: https://078-atithan.github.io
      # One reading can use up to three requests when diviners are switched.
      - key: READINGS_PER_MINUTE
        value: "6"
      - key: DAILY_READING_LIMIT
        value: "200"
